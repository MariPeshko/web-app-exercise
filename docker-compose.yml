# version: '0.1'

services:

  # Data base (Example)
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - studai-net

  # Backend FastAPI (Python 3.12)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      RAG_SERVICE_URL: http://ai_core:8001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - studai-net

  # RAG Module FastAPI (Python 3.10)
  ai_core:
    build:
      context: ./ai_core
      dockerfile: Dockerfile
    container_name: ai_core
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./ai_core:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - studai-net

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - studai-net

  # gateway:
  #     build: ./gateway
  #     container_name: gateway
  #     restart: always
  #     ports:
  #       - "80:80"
  #     depends_on:
  #       - backend
  #       - frontend
  #     networks:
  #       - studai-net

networks:
  studai-net:
    driver: bridge

volumes: 
   postgres_data: # Docker itself manages this folder on your PC